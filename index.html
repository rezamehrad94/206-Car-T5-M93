<!DOCTYPE html>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f2f4f7;--card:#fff;--tx:#1b2430;--mu:#6b7686;--ac:#1f5fae;--acx:#fff;--bd:#dde1e7;--ok:#1a8f4c;--wn:#c77700;--er:#c62828;--g1:#1f3a5f;--g2:#2f6fb5}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151b;--card:#1b222b;--tx:#e8ecf2;--mu:#98a3b3;--ac:#6fa3e8;--acx:#10141a;--bd:#2d3643;--ok:#4cc27f;--wn:#f0a43a;--er:#ef6b6b;--g1:#16304f;--g2:#24518a}}
:root[data-theme="dark"]{--bg:#11151b;--card:#1b222b;--tx:#e8ecf2;--mu:#98a3b3;--ac:#6fa3e8;--acx:#10141a;--bd:#2d3643;--ok:#4cc27f;--wn:#f0a43a;--er:#ef6b6b;--g1:#16304f;--g2:#24518a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,Vazirmatn,Tahoma,sans-serif;padding:12px 12px 180px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:12px}
.hd{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:18px;padding:14px;margin-bottom:12px}
.hd label,.hd .mu{color:#cfe0f5}.hd input{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)}
.big{font-size:22px;font-weight:700}
input,select,textarea{width:100%;padding:10px;margin:4px 0 8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input.ck{width:22px;height:22px;margin:0 0 0 10px;flex:none}
label,.mu{font-size:13px;color:var(--mu)}.row{display:flex;gap:8px}.row>div{flex:1}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:11px;padding:11px 14px;font:inherit;width:100%}
.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd);width:auto;padding:7px 12px;font-size:14px}
.btn.d{background:var(--er);color:#fff}
.it{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.it:last-child{border:0}
.x{background:none;border:0;color:var(--er);font-size:18px;padding:2px 6px}.e{color:var(--ac)}
.ok{color:var(--ok)}.wn{color:var(--wn)}.er{color:var(--er)}.hide{display:none}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--ac)}
.nb{position:fixed;left:10px;right:10px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:8px 6px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.nb button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:12px;line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 8px;border-radius:20px}
.nb svg{display:block}.nb button.on{color:var(--acx);background:var(--ac);font-weight:700}
.tb{display:flex;gap:8px;align-items:center;margin-bottom:8px}.tb input{margin:0}
</style></head><body><div id="app"></div>
<script>
const K="car206",MD=[31,31,31,31,31,31,30,30,30,30,30,29];
const PLAN0=[["روغن موتور + فیلتر",7000,6],["فیلتر هوا",15000,12],["فیلتر کابین",15000,12],["فیلتر بنزین",20000,24],["شمع",30000,24],["روغن گیربکس",60000,48],["تسمه تایم + بلبرینگ",60000,48],["تسمه دینام/پمپ",60000,48],["لنت جلو",30000,24],["لنت عقب",40000,36],["مایع ترمز",40000,24],["ضدیخ",40000,24]];
const DM={};PLAN0.forEach(p=>DM[p[0]]=p[2]);
const SVCX=["بازدید فنی عمومی","سرویس ترمز","سرویس کولر","تنظیم باد و بالانس","شست‌وشوی انژکتور و دریچه گاز","تعویض روغن فرمان","سرویس جلوبندی","معاینه فنی","وایر شمع"];
const PARTS=["لنت جلو","لنت عقب","دیسک ترمز","شمع","وایر شمع","فیلتر روغن","فیلتر هوا","فیلتر کابین","فیلتر بنزین","تسمه تایم + بلبرینگ","تسمه دینام/پمپ","واتر پمپ","ترموستات","باتری","لاستیک","کمک فنر جلو","کمک فنر عقب","طبق / بوش","سیبک","سینی/میل لنگ","کوئل","سنسور اکسیژن","دینام","استارت","صفحه و دیسک کلاچ","رادیاتور","برف‌پاک‌کن","لامپ / چراغ","آینه / شیشه"];
const DOC0=["بیمه شخص ثالث","بیمه بدنه","معاینه فنی","عوارض سالانه"];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const newCar=n=>({id:uid(),name:n,model:"",year:"",plate:"",km:0,plan:PLAN0.map(p=>({n:p[0],i:p[1],m:p[2]})),log:[],docs:DOC0.map(n=>({n,d:""}))});
function norm(o){if(o&&o.cars&&o.cars.length)return o;const c=newCar("ماشین من");if(o&&(o.log||o.plan)){c.name=c.model="پژو ۲۰۶ تیپ ۵";c.year="۱۳۹۳";c.km=o.km||0;if(o.plan)c.plan=o.plan.map(p=>({n:p.n,i:p.i,m:p.m!=null?p.m:(DM[p.n]||0)}));c.log=o.log||[]}return{cars:[c],cur:c.id,_t:(o&&o._t)||0}}
let S=norm(null);try{const r=localStorage.getItem(K);if(r)S=norm(JSON.parse(r))}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
let DB=null,ST="",tm=null,tab="home",EI=null,DX=null,SELM=false,SEL=[],CE=null;
const $=id=>document.getElementById(id),C=()=>S.cars.find(c=>c.id===S.cur)||S.cars[0];
const En=s=>String(s==null?"":s).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/٫/g,".").replace(/[,٬\s]/g,"");
const fm=n=>Number(n||0).toLocaleString("fa-IR");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function nd(s){s=En(s).replace(/[-.]/g,"/");if(/^\d{8}$/.test(s))s=s.replace(/(\d{4})(\d\d)(\d\d)/,"$1/$2/$3");const m=/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/.exec(s);if(!m||+m[2]<1||+m[2]>12||+m[3]<1||+m[3]>31)return null;return m[1]+"/"+m[2].padStart(2,"0")+"/"+m[3].padStart(2,"0")}
function dn(s){const m=/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/.exec(s||"");if(!m)return null;const y=+m[1]-979;let n=365*y+Math.floor(y/33)*8+Math.floor((y%33+3)/4);for(let i=0;i<+m[2]-1;i++)n+=MD[i];return n+ +m[3]-1}
function today(){const p=new Intl.DateTimeFormat("en-u-ca-persian-nu-latn",{year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()),g=t=>p.find(x=>x.type===t).value;return g("year")+"/"+g("month")+"/"+g("day")}
const T0=dn(today());
const netUpd=()=>{const e=$("net");if(e){const on=navigator.onLine;e.textContent=on?"● آنلاین":"○ آفلاین";e.style.cssText="font-size:12px;margin-inline-end:8px;color:var(--"+(on?"ok":"mu")+")"}};addEventListener("online",netUpd);addEventListener("offline",netUpd);
const sst=()=>{const e=$("st");if(e){e.textContent=ST;e.style.color=""}};
const toast=m=>{const e=$("st");if(e){e.textContent=m;e.style.color="var(--er)"}};
const save=()=>{S._t=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
if(DB){clearTimeout(tm);tm=setTimeout(()=>{DB.set({j:JSON.stringify(S)}).then(()=>{ST="ذخیره روی سرور ✓";sst()}).catch(()=>{ST="خطا در ذخیره سرور";sst()})},400)}};
function pst(c,p){let lk=null,ld=null;c.log.forEach(e=>{if(e.item!==p.n||e.t==="fuel")return;if(e.km&&(lk===null||e.km>lk))lk=e.km;const x=dn(e.d);if(x!==null&&(ld===null||x>ld))ld=x});
if(lk===null&&ld===null)return{u:9e9,c:"mu",t:"ثبت نشده",nx:""};
const rk=lk!==null&&p.i&&c.km?lk+p.i-c.km:null,rd=ld!==null&&p.m?ld+p.m*30-T0:null;let u=9e8,L=[],bad=0,wr=0;
if(rk!==null){u=Math.min(u,rk/p.i);L.push(rk<0?fm(-rk)+" km عقب":fm(rk)+" km مانده");if(rk<0)bad=1;else if(rk<=1000)wr=1}
if(rd!==null){u=Math.min(u,rd/(p.m*30));L.push(rd<0?fm(-rd)+" روز عقب":fm(rd)+" روز مانده");if(rd<0)bad=1;else if(rd<=30)wr=1}
if(!L.length)L.push("کیلومتر فعلی را بزنید");
return{u,c:bad?"er":wr?"wn":"ok",t:L.join("<br>"),nx:lk!==null?"بعدی: "+fm(lk+p.i)+" km":""}}
const xb=(k,i,t)=>`<button class="x" onclick="dl('${k}','${i}')">${DX===k+i?"تأیید؟":(t||"×")}</button>`;
function head(){let h=`<div class="tb"><b style="flex:1;font-size:17px">🚗 دفترچه سرویس</b><span id="net"></span>`;
if(S.cars.length>1)h+=`<select style="width:55%;margin:0" onchange="S.cur=this.value;EI=null;SEL=[];SELM=false;save();draw()">${S.cars.map(c=>`<option value="${c.id}" ${c.id===S.cur?"selected":""}>${esc(c.name)}</option>`).join("")}</select>`;return h+"</div>"}
function home(){const c=C();let h=`<div class="hd"><div class="mu">${esc(c.model)} ${esc(c.year)} ${c.plate?"· "+esc(c.plate):""}</div><div class="big">${esc(c.name)}</div><label>کیلومتر فعلی</label><input id="km" inputmode="numeric" value="${c.km||""}" placeholder="مثلاً 120500" onchange="C().km=+En(this.value)||0;save();draw()"></div>`;
h+=`<div class="card"><b>وضعیت سرویس‌ها (به ترتیب فوریت)</b>`;
c.plan.map(p=>({p,s:pst(c,p)})).sort((a,b)=>a.s.u-b.s.u).forEach(({p,s})=>h+=`<div class="it"><div>${esc(p.n)}<div class="mu">هر ${fm(p.i)} km${p.m?" / "+fm(p.m)+" ماه":""}</div></div><div style="text-align:left" class="${s.c}">${s.t}<div class="mu">${s.nx}</div></div></div>`);
h+=`</div><div class="card"><b>مدارک و انقضا</b>`;
c.docs.forEach((d,i)=>{const x=dn(d.d),r=x===null?null:x-T0,cl=r===null?"mu":r<0?"er":r<=30?"wn":"ok",t=r===null?"ثبت نشده":r<0?fm(-r)+" روز گذشته":fm(r)+" روز مانده";
h+=`<div class="it"><div style="flex:1">${esc(d.n)}<input inputmode="numeric" placeholder="تاریخ انقضا مثل 1405/12/29" value="${esc(d.d)}" onchange="setDoc(${i},this.value)"></div><div style="text-align:left" class="${cl}">${t}<br>${xb("d",i)}</div></div>`});
return h+`<div class="row"><div><input id="dn" placeholder="نام مدرک جدید"></div><div><input id="dd" inputmode="numeric" placeholder="تاریخ انقضا"></div></div><button class="btn s" onclick="addDoc()">+ افزودن مدرک</button></div>`}
function setDoc(i,v){const d=nd(v);C().docs[i].d=d||"";save();draw();if(v.trim()&&!d)toast("تاریخ نامعتبر؛ مثل 1405/12/29")}
function addDoc(){const n=$("dn").value.trim(),v=$("dd").value.trim(),d=v?nd(v):"";if(!n)return toast("نام مدرک را وارد کنید");if(v&&!d)return toast("تاریخ نامعتبر");C().docs.push({n,d});save();draw()}
function logv(t){const c=C();if(EI!==null&&(!c.log[EI]||c.log[EI].t!==t))EI=null;
const items=c.log.map((e,i)=>({e,i})).filter(x=>x.e.t===t).sort((a,b)=>(b.e.d||"").localeCompare(a.e.d||"")||b.i-a.i);
const nm=t==="svc"?[...new Set(c.plan.map(p=>p.n).concat(SVCX))]:PARTS;
let h=`<div class="card"><b>${EI!==null?"ویرایش ثبت":"ثبت جدید"}</b>`;
if(t!=="fuel")h+=`<label>${t==="svc"?"نوع سرویس":"نام قطعه"}</label><select id="it" onchange="$('cu').classList.toggle('hide',this.value!='__')">${nm.map(n=>`<option>${esc(n)}</option>`).join("")}<option value="__">دلخواه…</option></select><input id="cu" class="hide" placeholder="نام را بنویسید">`;
h+=`<div class="row"><div><label>تاریخ شمسی</label><input id="d" value="${today()}" inputmode="numeric"></div><div><label>کیلومتر</label><input id="k" inputmode="numeric" value="${c.km||""}"></div></div>`;
h+=t==="fuel"?`<div class="row"><div><label>لیتر</label><input id="l" inputmode="decimal" oninput="fc()"></div><div><label>نوع بنزین (قیمت هر لیتر)</label><select id="pr" onchange="fc()"><option value="1500">۱٬۵۰۰ تومان</option><option value="3000">۳٬۰۰۰ تومان</option><option value="10000">۱۰٬۰۰۰ تومان</option></select></div></div><input id="c" type="hidden"><div class="big" id="ft" style="font-size:17px;margin-bottom:8px">مبلغ: ۰ تومان</div><label>محل / پمپ</label><input id="w">`:`<div class="row"><div><label>هزینه (تومان)</label><input id="c" inputmode="numeric"></div><div><label>محل / برند</label><input id="w"></div></div>`;
h+=`<label>توضیحات</label><input id="n"><button class="btn" onclick="add('${t}')">${EI!==null?"ذخیره تغییرات":"ثبت"}</button>${EI!==null?`<button class="btn s" style="width:100%;margin-top:8px" onclick="EI=null;draw()">انصراف از ویرایش</button>`:""}</div>`;
const tot=items.reduce((a,x)=>a+(+x.e.c||0),0);let cons={};
if(t==="fuel"){const f=items.map(x=>x).filter(x=>x.e.km&&x.e.l).sort((a,b)=>a.e.km-b.e.km);for(let j=1;j<f.length;j++){const dk=f[j].e.km-f[j-1].e.km;if(dk>0)cons[f[j].i]=f[j].e.l/dk*100}
const v=Object.values(cons);if(v.length)h+=`<div class="card"><div class="mu">میانگین مصرف (فرض: باک پر در هر بار)</div><div class="big">${(v.reduce((a,b)=>a+b,0)/v.length).toLocaleString("fa-IR",{maximumFractionDigits:1})} <span class="mu">لیتر در ۱۰۰ km</span></div></div>`}
if(t==="fuel")h+=`<div class="card"><b>انتقال به اپ خرج خانواده</b><div class="mu">دکمه را بزن و متن را در اپ خرج، دسته‌ی «ماشین» ← «وارد کردن بنزین‌ها» بچسبان. ثبت‌های تکراری دوباره حساب نمی‌شوند.</div><textarea id="fx" rows="2" readonly></textarea><button class="btn s" onclick="fexp()">کپی بنزین‌ها</button></div>`;
h+=`<div class="card"><div class="tb">${SELM?`<button class="btn s" onclick="selAll('${t}')">همه</button><span class="mu" style="flex:1">${fm(SEL.length)} انتخاب‌شده</span>${SEL.length?`<button class="btn s d" onclick="dl('b','0')">${DX==="b0"?"تأیید حذف؟":"حذف"}</button>`:""}<button class="btn s" onclick="selTog()">لغو</button>`:`<input placeholder="جستجو…" oninput="flt(this.value)"><button class="btn s" onclick="selTog()">انتخاب</button>`}</div><div class="mu">${fm(items.length)} مورد · جمع: ${fm(tot)} تومان</div>`;
if(!items.length)h+=`<div class="mu" style="padding:10px 0">هنوز چیزی ثبت نشده.</div>`;
items.forEach(({e,i})=>{const sub=[e.d,fm(e.km)+" km"];if(t==="fuel"&&e.l)sub.push(fm(e.l)+" لیتر"+(e.pr?" × "+fm(e.pr):""));if(cons[i])sub.push(cons[i].toLocaleString("fa-IR",{maximumFractionDigits:1})+" L/100");if(e.w)sub.push(esc(e.w));
h+=`<div class="it" data-s="${esc((e.item+" "+e.d+" "+(e.w||"")+" "+(e.n||"")).toLowerCase())}">${SELM?`<input type="checkbox" class="ck" ${SEL.includes(i)?"checked":""} onchange="tg(${i})">`:""}<div style="flex:1">${esc(e.item)}<div class="mu">${sub.join(" · ")}${e.n?"<br>"+esc(e.n):""}</div></div><div style="text-align:left">${fm(e.c)}${SELM?"":`<br><button class="x e" onclick="edt(${i})">✎</button>${xb("e",i)}`}</div></div>`});
return h+"</div>"}
function flt(q){q=q.trim().toLowerCase();document.querySelectorAll(".it[data-s]").forEach(r=>r.classList.toggle("hide",!!q&&r.dataset.s.indexOf(q)<0))}
const selTog=()=>{SELM=!SELM;SEL=[];DX=null;draw()};
const tg=i=>{const k=SEL.indexOf(i);k<0?SEL.push(i):SEL.splice(k,1);DX=null;draw()};
const selAll=t=>{const ix=C().log.map((e,i)=>e.t===t?i:-1).filter(i=>i>=0);SEL=SEL.length===ix.length?[]:ix;draw()};
const edt=i=>{EI=i;draw();scrollTo(0,0)};
function fillEdit(){const c=C();if(EI===null||!c.log[EI])return;const e=c.log[EI],s=$("it");if(s){const has=[...s.options].some(o=>o.value===e.item);s.value=has?e.item:"__";$("cu").classList.toggle("hide",has);if(!has)$("cu").value=e.item}
const v={d:e.d,k:e.km||"",c:e.c||"",w:e.w||"",n:e.n||"",l:e.l||""};for(const k in v){const x=$(k);if(x)x.value=v[k]}const pr=$("pr");if(pr){const g=e.pr||(e.l?e.c/e.l:3000);pr.value=[1500,3000,10000].reduce((a,b)=>Math.abs(b-g)<Math.abs(a-g)?b:a);fc()}}
function fc(){const l=+En($("l").value)||0,p=+$("pr").value,t=$("ft");if(t)t.textContent="مبلغ: "+fm(Math.round(l*p))+" تومان"}
function fexp(){const c=C();c.log.forEach(e=>{if(e.t==="fuel"&&!e.id)e.id=uid()});save();
const r=c.log.filter(e=>e.t==="fuel"&&e.c).map(e=>{const p=(e.d||"").split("/");return[e.id,+p[0],+p[1],+p[2],e.c,e.l||0,e.pr||0]});
if(!r.length)return toast("هنوز بنزینی ثبت نشده");
const s="FUEL:"+JSON.stringify({v:1,r});$("fx").value=s;$("fx").select();(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast("کپی شد؛ توی اپ خرج وارد کنید"),()=>toast("متن را دستی کپی کنید"))}
function add(t){const c=C();let it=t==="fuel"?"بنزین":$("it").value;if(it==="__")it=$("cu").value.trim();if(!it)return toast("نام را وارد کنید");
const d=nd($("d").value||today());if(!d)return toast("تاریخ نامعتبر؛ مثل 1405/08/20");
const km=+En($("k").value)||0,o={t,item:it,d,km,c:+En($("c").value)||0,w:$("w").value,n:$("n").value};if(t==="fuel"){o.l=+En($("l").value)||0;o.pr=+$("pr").value;o.c=Math.round(o.l*o.pr)}
if(EI!==null&&c.log[EI]){o.id=c.log[EI].id;c.log[EI]=o;EI=null}else c.log.push(o);if(km>c.km)c.km=km;save();draw()}
function dl(k,i){const id=k+i;if(DX!==id){DX=id;draw();return}DX=null;const c=C();
if(k==="e"){EI=null;c.log.splice(+i,1)}else if(k==="d")c.docs.splice(+i,1);else if(k==="p")c.plan.splice(+i,1);
else if(k==="b"){const s=new Set(SEL);c.log=c.log.filter((e,j)=>!s.has(j));SEL=[];SELM=false;EI=null}
else if(k==="c"){S.cars=S.cars.filter(x=>x.id!==i);if(S.cur===i)S.cur=S.cars[0].id;CE=null}
save();draw()}
function rep(){const c=C(),L=c.log,tot=t=>L.filter(e=>e.t===t).reduce((a,e)=>a+(+e.c||0),0),s=tot("svc"),p=tot("part"),f=tot("fuel");
const kms=L.map(e=>+e.km).filter(Boolean),span=kms.length?Math.max(...kms)-Math.min(...kms):0;
const grp=fn=>{const m={};L.forEach(e=>{const k=fn(e);if(k)m[k]=(m[k]||0)+(+e.c||0)});return Object.entries(m)};
const bars=(a,n)=>{a=a.slice(0,n);const mx=Math.max(1,...a.map(x=>x[1]));return a.map(x=>`<div style="margin-top:8px"><div class="it" style="padding:0;border:0"><span>${esc(x[0])}</span><span>${fm(x[1])}</span></div><div class="bar"><i style="width:${x[1]/mx*100}%"></i></div></div>`).join("")||`<div class="mu">داده‌ای نیست</div>`};
let h=`<div class="card"><div class="mu">جمع کل هزینه (تومان)</div><div class="big">${fm(s+p+f)}</div><div class="mu">سرویس: ${fm(s)} · قطعات: ${fm(p)} · بنزین: ${fm(f)}</div></div>`;
h+=`<div class="card"><b>هزینه به ازای هر کیلومتر</b><div class="mu">بازه‌ی ثبت‌شده: ${fm(span)} km</div>${span?`<div class="it"><span>نگهداری (سرویس + قطعات)</span><b>${fm(Math.round((s+p)/span))}</b></div><div class="it"><span>با بنزین</span><b>${fm(Math.round((s+p+f)/span))}</b></div>`:`<div class="mu">برای محاسبه حداقل دو ثبت با کیلومتر لازم است.</div>`}</div>`;
h+=`<div class="card"><b>هزینه ماهانه (۱۲ ماه آخر)</b>${bars(grp(e=>(e.d||"").slice(0,7)).sort((a,b)=>b[0].localeCompare(a[0])),12)}</div>`;
h+=`<div class="card"><b>هزینه سالانه</b>${bars(grp(e=>(e.d||"").slice(0,4)).sort((a,b)=>b[0].localeCompare(a[0])),10)}</div>`;
return h+`<div class="card"><b>پرهزینه‌ترین موارد</b>${bars(grp(e=>e.t==="fuel"?"":e.item).sort((a,b)=>b[1]-a[1]),6)}</div>`}
function more(){const c=C();let h=`<div class="card"><b>ماشین‌ها</b>`;
S.cars.forEach(x=>h+=`<div class="it"><div style="flex:1" onclick="S.cur='${x.id}';save();draw()">${esc(x.name)}${x.id===S.cur?" ✓":""}<div class="mu">${esc(x.model)} ${esc(x.year)} ${esc(x.plate)}</div></div><div><button class="x e" onclick="CE='${x.id}';draw()">✎</button>${S.cars.length>1?xb("c",x.id):""}</div></div>`);
h+=`<b>${CE?"ویرایش ماشین":"افزودن ماشین جدید"}</b><input id="cn" placeholder="نام (مثلاً ماشین من)"><div class="row"><div><input id="cm" placeholder="مدل"></div><div><input id="cy" placeholder="سال"></div></div><input id="cp" placeholder="پلاک"><button class="btn" onclick="saveCar()">${CE?"ذخیره تغییرات":"افزودن ماشین"}</button>${CE?`<button class="btn s" style="width:100%;margin-top:8px" onclick="CE=null;draw()">انصراف</button>`:""}</div>`;
h+=`<div class="card"><b>برنامه سرویس «${esc(c.name)}»</b><div class="mu">فاصله بر حسب km و ماه؛ صفر یعنی بدون آن شرط. فاصله‌ها تخمینی‌اند؛ طبق دفترچه یا تعمیرکار تنظیم کنید.</div>`;
c.plan.forEach((p,i)=>h+=`<div class="it" style="display:block"><input value="${esc(p.n)}" onchange="pn(${i},this.value)"><div class="row"><div><label>km</label><input inputmode="numeric" value="${p.i}" onchange="pf(${i},'i',this.value)"></div><div><label>ماه</label><input inputmode="numeric" value="${p.m||0}" onchange="pf(${i},'m',this.value)"></div><div style="flex:none;padding-top:22px">${xb("p",i)}</div></div></div>`);
h+=`<input id="pn" placeholder="مورد جدید"><div class="row"><div><input id="pk" inputmode="numeric" placeholder="هر چند km"></div><div><input id="pm" inputmode="numeric" placeholder="هر چند ماه"></div></div><button class="btn s" onclick="addPlan()">+ افزودن به برنامه</button></div>`;
return h+`<div class="card"><b>پشتیبان</b><p class="mu">اطلاعات فقط روی همین دستگاه ذخیره می‌شود و بدون اینترنت هم کار می‌کند. گاهی پشتیبان بگیرید.</p><textarea id="bx" rows="3" placeholder="متن پشتیبان اینجا نمایش داده یا چسبانده می‌شود"></textarea><button class="btn s" onclick="bk()">کپی پشتیبان</button> <button class="btn s" onclick="rs()">بازگردانی</button></div>`}
function fillCar(){if(!CE||!$("cn"))return;const c=S.cars.find(x=>x.id===CE);if(!c)return;$("cn").value=c.name;$("cm").value=c.model;$("cy").value=c.year;$("cp").value=c.plate}
function saveCar(){const n=$("cn").value.trim();if(!n)return toast("نام ماشین را وارد کنید");let c=CE&&S.cars.find(x=>x.id===CE);if(c)c.name=n;else{c=newCar(n);S.cars.push(c);S.cur=c.id}c.model=$("cm").value;c.year=$("cy").value;c.plate=$("cp").value;CE=null;save();draw()}
function pn(i,v){const c=C(),o=c.plan[i].n,n=v.trim();if(!n||n===o)return;c.log.forEach(e=>{if(e.item===o)e.item=n});c.plan[i].n=n;save();draw()}
const pf=(i,f,v)=>{C().plan[i][f]=+En(v)||0;save();draw()};
function addPlan(){const n=$("pn").value.trim(),k=+En($("pk").value)||0,m=+En($("pm").value)||0;if(!n)return toast("نام مورد را وارد کنید");if(!k&&!m)return toast("حداقل km یا ماه را وارد کنید");C().plan.push({n,i:k,m});save();draw()}
function bk(){const j=JSON.stringify(S);$("bx").value=j;$("bx").select();(navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>toast("کپی شد؛ در Notes ذخیره کنید"),()=>toast("متن را دستی کپی کنید"))}
function rs(){const j=$("bx").value.trim();if(!j)return toast("اول متن پشتیبان را در کادر بچسبانید");try{S=norm(JSON.parse(j));save();draw();toast("بازگردانی شد")}catch(e){toast("پشتیبان نامعتبر است")}}
const TABS=[["home","خانه","🏠"],["svc","سرویس","🛠"],["part","قطعات","⚙️"],["fuel","بنزین","⛽"],["rep","گزارش","📊"],["more","بیشتر","☰"]];
const ic=p=>`<svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={home:ic('<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>'),svc:ic('<path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8 6.2 21l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>'),part:ic('<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>'),fuel:ic('<path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M6 8h6M14 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/>'),rep:ic('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),more:ic('<path d="M4 7h16M4 12h16M4 17h16"/>')};
const go=t=>{tab=t;EI=null;DX=null;SELM=false;SEL=[];draw();scrollTo(0,0)};
function draw(){const v={home,svc:()=>logv("svc"),part:()=>logv("part"),fuel:()=>logv("fuel"),rep,more}[tab]();
$("app").innerHTML=head()+v+`<div class="mu" id="st" style="text-align:center;margin:8px">${ST}</div><div class="nb">${TABS.map(t=>`<button class="${tab===t[0]?"on":""}" onclick="go('${t[0]}')">${IC[t[0]]}<span>${t[1]}</span></button>`).join("")}</div>`;fillEdit();fillCar();netUpd()}

draw();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
